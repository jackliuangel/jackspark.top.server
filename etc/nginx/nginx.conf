user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	types_hash_max_size 2048;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;
	ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	client_body_timeout 3600s;
	client_header_timeout 3600s;
	send_timeout 3600s;

	keepalive_timeout 65;
	keepalive_requests 100;

	client_body_buffer_size 128k;
	client_header_buffer_size 1k;
	large_client_header_buffers 4 4k;

	server {
    		listen 80 default_server;
    		listen [::]:80 default_server;
    		server_name 47.128.3.198;
		
		client_max_body_size 1G;

		location = / {
			return 200 "Server is running. Hosted by Jack L\n";
			add_header Content-Type text/plain;
		}

		location /health {
			access_log off;
			return 200 "healthy\n";
			add_header Content-Type text/plain;
		}

		# 为了 将linux 服务器的端口 80 映射到本地mac端口（例如50526），方便在本地mac 的vscode 可以通过port forward 访问linux服务器上的服务。所以要把待debug的url暴露在localhost 的80 配置下
		#location /tank {
        #		alias /var/www/html/tank;
        #		index index.html;
        #		try_files $uri $uri/ /tank/index.html;
    	#	}
	}




	server {
		listen 80;
		listen [::]:80;
		server_name jackspark.top www.jackspark.top;

		# Allow acme-challenge to bypass HTTPS redirect
		location ^~ /.well-known/acme-challenge/ {
			root /var/www/html;
			allow all;
		}

		location / {
			return 301 https://$server_name$request_uri;
		}
	}

	server {
		listen 80;
		listen [::]:80;
		server_name files.jackspark.top;

		# Allow acme-challenge to bypass HTTPS redirect
		location ^~ /.well-known/acme-challenge/ {
			root /var/www/certbot;
			allow all;
		}

		location / {
			return 301 https://$server_name$request_uri;
		}
	}
	server {
		listen 443 ssl http2;
		listen [::]:443 ssl http2;
		server_name jackspark.top www.jackspark.top;

		ssl_certificate /etc/letsencrypt/live/jackspark.top/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/jackspark.top/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		add_header X-Frame-Options DENY;
		add_header X-Content-Type-Options nosniff;

		root /var/www/html;
		index index.html index.htm;

		# WebMCP: gated upstream by a Cloudflare WAF rule that requires a
		# verified client certificate (cf.tls_client_auth.cert_verified).
		# Only verified requests reach this point, so a 200 here == verified.
		location = /webmcp/auth {
			default_type application/json;
			add_header Cache-Control "no-store";
			return 200 '{"verified":true}';
		}

		location / { try_files $uri $uri/ =404; }
	}

	server {
		listen 443 ssl http2;
		listen [::]:443 ssl http2;
		server_name files.jackspark.top;

		ssl_certificate /etc/letsencrypt/live/files.jackspark.top/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/files.jackspark.top/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		add_header X-Frame-Options DENY;
		add_header X-Content-Type-Options nosniff;

		root /tmp/video_download/congliulyc@gmail.com;
		autoindex on;
		charset utf-8;

		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header Pragma "no-cache";
		add_header Expires "0";
		add_header Accept-Ranges bytes;

		sendfile on;
		tcp_nopush on;
		tcp_nodelay on;
		keepalive_timeout 65;

		output_buffers 2 32k;
		postpone_output 1460;

		gzip off;

		access_log /var/log/nginx/files_download_access.log;
		error_log /var/log/nginx/files_download_error.log;

		location ~ ^/[^/]+$ {
			add_header Content-Disposition "attachment";
			add_header Cache-Control "no-cache, no-store, must-revalidate";
			add_header Pragma "no-cache";
			add_header Expires "0";
			add_header Accept-Ranges bytes;
		}
	}





	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
